name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalacja zaleznosci
        run: npm ci

      - name: Kontrola typow
        run: npm run typecheck

      - name: Testy
        run: npm test
