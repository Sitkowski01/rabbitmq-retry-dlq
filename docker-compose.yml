services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-retry-dlq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # panel zarządzania: http://localhost:15672 (guest / guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
